version: '3.8'

services:
  infrash:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      - INFRASH_ENV=production
      - INFRASH_CONFIG=/app/config/infrash-config.yaml
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    
  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    
  postgres:
    image: postgres:13-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=infrash
      - POSTGRES_PASSWORD=infrash_password
      - POSTGRES_DB=infrash
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
