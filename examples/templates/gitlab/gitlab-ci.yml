stages:
  - validate
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.9"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  INFRASH_CONFIG: "$CI_PROJECT_DIR/infrash-config.yaml"

# Szablon dla zadań Python
.python-job:
  image: python:$PYTHON_VERSION
  cache:
    paths:
      - .pip-cache/
      - venv/
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install infrash
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

# Walidacja kodu
validate:
  extends: .python-job
  stage: validate
  script:
    - pip install flake8 mypy
    - flake8 src/ tests/
    - mypy src/
  allow_failure: true

# Zadanie testowe
test:
  extends: .python-job
  stage: test
  script:
    - pip install pytest pytest-cov
    - infrash diagnose
    - infrash repo status
    - pytest tests/ --cov=src/ --cov-report=xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Zadanie budowania
build:
  extends: .python-job
  stage: build
  script:
    - pip install build
    - python -m build
    - infrash build --output dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Zadanie wdrażania na środowisko testowe
deploy-staging:
  extends: .python-job
  stage: deploy
  script:
    - infrash remote deploy --host $STAGING_HOST --user $STAGING_USER --key $SSH_PRIVATE_KEY --repo $CI_REPOSITORY_URL --branch $CI_COMMIT_REF_NAME
  environment:
    name: staging
    url: http://$STAGING_HOST:8000
  only:
    - develop

# Zadanie wdrażania na środowisko produkcyjne
deploy-production:
  extends: .python-job
  stage: deploy
  script:
    - infrash remote deploy --host $PRODUCTION_HOST --user $PRODUCTION_USER --key $SSH_PRIVATE_KEY --repo $CI_REPOSITORY_URL --branch $CI_COMMIT_REF_NAME
  environment:
    name: production
    url: http://$PRODUCTION_HOST:8000
  only:
    - main
  when: manual
