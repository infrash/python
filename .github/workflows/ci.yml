name: Infrash CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        pip install -e .
    - name: Run tests
      run: |
        pytest tests/

  # Format-specific validation jobs
  terraform-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'terraform')
    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Init
        run: |
          if [ -d "terraform" ]; then
            cd terraform && terraform init -backend=false
          fi
      - name: Terraform Validate
        run: |
          if [ -d "terraform" ]; then
            cd terraform && terraform validate
          fi

  docker-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'docker')
    steps:
      - uses: actions/checkout@v3
      - name: Lint Dockerfile
        uses: brpaz/hadolint-action@v1.5.0
        with:
          dockerfile: "Dockerfile"

  kubernetes-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'kubernetes')
    steps:
      - uses: actions/checkout@v3
      - name: Validate Kubernetes manifests
        uses: instrumenta/kubeval-action@master
        with:
          files: kubernetes/*.yaml

  ansible-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ansible')
    steps:
      - uses: actions/checkout@v3
      - name: Run ansible-lint
        uses: ansible/ansible-lint-action@main
        with:
          targets: "ansible/"

  jenkins-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'jenkins')
    steps:
      - uses: actions/checkout@v3
      - name: Validate Jenkinsfile
        uses: jenkinsci/pipeline-linter-connector-action@master
        with:
          jenkinsfile: "Jenkinsfile"

  # Cloud provider specific validations
  aws-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'aws')
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install AWS CLI
        run: |
          pip install awscli
      - name: Validate AWS CloudFormation templates
        run: |
          for template in aws/*.yaml aws/*.json; do
            if [ -f "$template" ]; then
              aws cloudformation validate-template --template-body file://$template
            fi
          done

  azure-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'azure')
    steps:
      - uses: actions/checkout@v3
      - name: Validate Azure ARM templates
        uses: azure/arm-deploy@v1
        with:
          scope: 'resourcegroup'
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: 'azure/template.json'
          deploymentMode: 'Validate'

  gcp-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'gcp')
    steps:
      - uses: actions/checkout@v3
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
      - name: Validate Deployment Manager templates
        run: |
          if [ -d "gcp" ]; then
            for template in gcp/*.yaml; do
              if [ -f "$template" ]; then
                gcloud deployment-manager deployments validate --config=$template
              fi
            done
          fi

  # Build and publish
  build:
    runs-on: ubuntu-latest
    needs: 
      - test
      - terraform-validate
      - docker-validate
      - kubernetes-validate
      - ansible-validate
      - jenkins-validate
      - aws-validate
      - azure-validate
      - gcp-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package
        run: |
          python -m build
      - name: Store build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/